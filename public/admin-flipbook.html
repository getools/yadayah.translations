<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="page-version" content="1784181605">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Admin - Yada Yah</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        .fb-section { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
        .fb-section h3 { margin: 0 0 4px; font-size: 1rem; color: #31345A; }
        .fb-section .desc { font-size: 0.82rem; color: #666; margin: 0 0 14px; }
        .fb-field { display: grid; grid-template-columns: 200px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
        .fb-field label { font-size: 0.85rem; font-weight: 600; color: #444; }
        .fb-field input[type=text],
        .fb-field textarea { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.88rem; font-family: inherit; width: 100%; max-width: 480px; box-sizing: border-box; }
        .fb-field textarea { min-height: 60px; resize: vertical; }
        .fb-section input[type=color] { width: 57.5px; height: 32px; padding: 0; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        .save-row { position: sticky; bottom: 0; background: #fafafa; border-top: 1px solid #e0e0e0; padding: 12px 16px; margin: 16px -16px -16px; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 8px 8px; }
        /* Multi-column row: a left-hand row label, then a strip of columns each
           with a header above its field (used by the Audio Player "Buttons" row). */
        .fb-row { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 14px; }
        .fb-row-label { flex: 0 0 190px; font-size: 0.85rem; font-weight: 600; color: #444; padding-top: 20px; }
        .fb-cols { display: flex; flex-wrap: wrap; gap: 20px; }
        .fb-col { display: flex; flex-direction: column; gap: 5px; }
        .fb-col > .h { font-size: 0.78rem; font-weight: 600; color: #444; }
        .fb-inline { display: inline-flex; align-items: center; gap: 6px; }
        .fb-suffix { font-size: 0.82rem; color: #666; }
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
    <div class="login-card">
        <h1>Admin</h1>
        <div class="field"><label for="login-user">Login</label><input type="text" id="login-user" autocomplete="username"></div>
        <div class="field"><label for="login-pass">Password</label>
            <div class="pass-wrap"><input type="password" id="login-pass" autocomplete="current-password">
                <button type="button" class="pass-toggle" onclick="togglePassword()" title="Show/hide password">&#128065;</button></div>
        </div>
        <div id="login-error" class="error-messages" style="display:none"></div>
        <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Login</button>
    </div>
</div>

<div id="app" class="container" style="display:none">
    <div class="app-header">
        <nav class="nav-tabs"></nav>
<script src="/js/admin-nav.js?v=21"></script>
        <div class="user-info">
            <span id="user-display"></span>
            <button class="btn btn-secondary btn-sm" onclick="doLogout()">Logout</button>
        </div>
    </div>

    <h1>Flipbook</h1>
    <p style="color:#666;font-size:0.88rem;margin:-4px 0 16px;">Defaults applied when rendering auto-generated bookmarks (last-viewed-page) whose individual fields are not set. Changes apply immediately.</p>

    <div id="form-container">
        <div style="text-align:center;padding:30px;color:#888;">Loading…</div>
    </div>
</div>

<script src="/js/admin-login.js?v=8"></script>
<script src="/js/admin-links.js?v=4"></script>
<script>
var API = '/api';

// Inline auth + login wiring — same pattern as admin-books.html. The shared
// admin-login.js renders the login modal but doesn't reveal the page itself;
// each admin page is responsible for showing its own #app div on success.
function checkAuth() {
    fetch(API + '/auth.php', {credentials:'include'}).then(function(r){return safeJson(r);}).then(function(d) {
        if (d.authenticated) {
            document.getElementById('app').style.display = '';
            document.getElementById('user-display').textContent = d.user_name;
            if (typeof applyPagePermissions === 'function') applyPagePermissions(d.pages);
            load();
        } else {
            document.getElementById('login-screen').classList.add('visible');
        }
    });
}
function doLogin() {
    var user = document.getElementById('login-user').value, pass = document.getElementById('login-pass').value;
    var errEl = document.getElementById('login-error'); errEl.style.display = 'none';
    fetch(API + '/auth.php', {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({login:user, password:pass})})
        .then(function(r){return safeJson(r);}).then(function(d) {
            if (d.authenticated) {
                document.getElementById('login-screen').classList.remove('visible');
                document.getElementById('app').style.display = '';
                document.getElementById('user-display').textContent = d.user_name;
                if (typeof applyPagePermissions === 'function') applyPagePermissions(d.pages);
                load();
            } else {
                errEl.textContent = d.error || 'Login failed'; errEl.style.display = '';
            }
        });
}
function doLogout() { fetch(API + '/auth.php', {method:'DELETE', credentials:'include'}).then(function() { location.reload(); }); }
function togglePassword() { var i = document.getElementById('login-pass'); i.type = i.type === 'password' ? 'text' : 'password'; }

// Section field definitions — drives both render and save payload.
// Same pattern as admin-home.html. setting_code (yy_setting) for each field.
var SECTIONS = [
    {
        title: 'Auto Bookmark',
        desc: 'When a user reads a flipbook, the page they leave on is auto-saved as a bookmark. These defaults are used to render that bookmark when its color/label/note fields are empty.',
        fields: [
            { code: 'auto-bookmark-color', label: 'Color',  type: 'color',    default: '#5b8def' },
            { code: 'auto-bookmark-label', label: 'Label',  type: 'text',     default: 'Resume reading' },
            { code: 'auto-bookmark-note',  label: 'Note',   type: 'textarea', default: '' }
        ]
    },
    {
        title: 'Bookmark Placeholder',
        desc: 'The faded outline bookmark icon shown in the upper-right of every visible flipbook page when no bookmark exists for that page. Click adds a bookmark.',
        fields: [
            { code: 'placeholder-width',   label: 'Width (px)',  type: 'number', default: '18' },
            { code: 'placeholder-height',  label: 'Height (px)', type: 'number', default: '22' },
            { code: 'placeholder-color',   label: 'Color',       type: 'color',  default: '#888888' },
            { code: 'placeholder-tooltip', label: 'Hover text',  type: 'text',   default: 'Add bookmark for page {page}' }
        ]
    },
    {
        title: 'Bookmark Icon Wrapper',
        desc: 'The clickable hit-area surrounding the bookmark glyph. Increasing width/height makes the icon easier to tap; the background tints the wrapper itself.',
        fields: [
            { code: 'icon-width',  label: 'Width (px)',  type: 'number', default: '24' },
            { code: 'icon-height', label: 'Height (px)', type: 'number', default: '28' },
            { code: 'icon-bg',     label: 'Background',  type: 'color',  default: '#ffffff' }
        ]
    },
    {
        title: 'Audio Player',
        desc: 'Colors and sizing for the TTS audio player that appears at the bottom of every flipbook page — the round speaker & play buttons, their icons, the progress/volume bars, and the read-along text highlights. Changes apply on the next flipbook pageview.',
        fields: [
            { type: 'row', label: 'Buttons', cols: [
                { header: 'Diameter',   field: { code: 'player-btn-size',         type: 'number', default: '43', min: 20, max: 120, suffix: 'px', width: '54px' } },
                { header: 'Background',  field: { code: 'player-btn-bg',          type: 'color',  default: '#1f3550' } },
                { header: 'Hover',       field: { code: 'player-btn-bg-hover',     type: 'color',  default: '#28456a' } },
                { header: 'Border',      field: { code: 'player-btn-border',       type: 'color',  default: '#2a4d70' } },
                { header: 'Size',        field: { code: 'player-btn-border-width', type: 'number', default: '1',  min: 0, max: 20, suffix: 'px', width: '54px' } }
            ] },
            { code: 'player-icon-color',     label: 'Icon color (speaker/play)',type: 'color', default: '#cfe1ff' },
            { code: 'player-track-bg',       label: 'Progress & volume track',  type: 'color', default: '#c8c8c8' },
            { code: 'player-fill-bg',        label: 'Progress indicator (fill)',type: 'color', default: '#1f3550' },
            { code: 'player-thumb-bg',       label: 'Volume slider knob',       type: 'color', default: '#cfe1ff' },
            { code: 'player-time-color',     label: 'Time readout text',        type: 'color', default: '#cfe1ff' },
            { code: 'player-pausing-bg',     label: 'Between-chapters pause bg',    type: 'color', default: '#4d3a1f' },
            { code: 'player-pausing-border', label: 'Between-chapters pause border',type: 'color', default: '#6d5a3a' },
            { code: 'player-pausing-color',  label: 'Between-chapters pause icon',  type: 'color', default: '#f7d77a' },
            { code: 'player-highlight',      label: 'Read-along highlight',     type: 'color', default: '#ffe696' },
            { code: 'player-url-highlight',  label: 'Search / link highlight',  type: 'color', default: '#ffc83c' }
        ]
    }
];

// Build the input control for one field def. Shared by the standard
// label/field rows and the multi-column "row" layout. Supports an optional
// `suffix` (e.g. "px" printed to the right of the field) and `width`.
function fieldInput(f, values) {
    var v = (values[f.code] != null) ? values[f.code] : f.default;
    var input;
    if (f.type === 'color') {
        var col = /^#[0-9a-f]{6}$/i.test(v) ? v : f.default;
        input = '<input type="color" data-code="' + esc(f.code) + '" value="' + esc(col) + '">';
    } else if (f.type === 'textarea') {
        input = '<textarea data-code="' + esc(f.code) + '" rows="3">' + esc(v) + '</textarea>';
    } else if (f.type === 'number') {
        var mn = (f.min != null) ? f.min : 6, mx = (f.max != null) ? f.max : 200;
        var w = f.width || '120px';
        input = '<input type="number" data-code="' + esc(f.code) + '" value="' + esc(v) + '" min="' + esc(mn) + '" max="' + esc(mx) + '" style="width:' + esc(w) + ';">';
    } else {
        input = '<input type="text" data-code="' + esc(f.code) + '" value="' + esc(v) + '">';
    }
    if (f.suffix) input = '<span class="fb-inline">' + input + '<span class="fb-suffix">' + esc(f.suffix) + '</span></span>';
    return input;
}

function render(values) {
    var c = document.getElementById('form-container');
    var html = '';
    SECTIONS.forEach(function(sec) {
        html += '<div class="fb-section"><h3>' + esc(sec.title) + '</h3><p class="desc">' + esc(sec.desc) + '</p>';
        sec.fields.forEach(function(f) {
            if (f.type === 'row') {
                html += '<div class="fb-row"><div class="fb-row-label">' + esc(f.label) + '</div><div class="fb-cols">';
                f.cols.forEach(function(col) {
                    html += '<div class="fb-col"><span class="h">' + esc(col.header) + '</span>' + fieldInput(col.field, values) + '</div>';
                });
                html += '</div></div>';
                return;
            }
            html += '<div class="fb-field"><label>' + esc(f.label) + '</label>' + fieldInput(f, values) + '</div>';
        });
        html += '</div>';
    });
    html += '<div class="save-row">'
          + '<span id="save-status" style="font-size:0.85rem;color:#888;"></span>'
          + '<button class="btn btn-primary" onclick="saveAll()">Save changes</button>'
          + '</div>';
    c.innerHTML = html;
}

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
}

function load() {
    fetch(API + '/admin-flipbook.php', { credentials: 'include' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d && d.error) { alert('Load failed: ' + d.error); return; }
            render(d || {});
        })
        .catch(function(err) { alert('Load failed: ' + err.message); });
}

function saveAll() {
    var payload = {};
    document.querySelectorAll('[data-code]').forEach(function(el) { payload[el.dataset.code] = el.value; });
    var status = document.getElementById('save-status');
    status.textContent = 'Saving…';
    fetch(API + '/admin-flipbook.php', {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); })
      .then(function(d) {
          if (d && d.error) { status.textContent = '✗ ' + d.error; status.style.color = '#c0392b'; return; }
          status.textContent = '✓ Saved';
          status.style.color = '#27ae60';
          setTimeout(function() { status.textContent = ''; }, 5000);
      }).catch(function(err) {
          status.textContent = '✗ ' + err.message;
          status.style.color = '#c0392b';
      });
}

document.getElementById('login-pass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
checkAuth();
</script>

</body>
</html>
