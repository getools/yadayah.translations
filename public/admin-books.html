    <style>

        .books-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }

        .books-table .actions button { padding: 3px 8px; font-size: 0.78rem; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: #fff; margin-right: 4px; }

<script>
var API = '/api';
var allSeries = [];
var allVolumes = [];

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function checkAuth() {
    fetch(API + '/auth.php', {credentials:'include'}).then(function(r){return safeJson(r);}).then(function(d) {
        if (d.authenticated) {
            document.getElementById('app').style.display = '';
            document.getElementById('user-display').textContent = d.user_name;
            applyPagePermissions(d.pages);
            loadBooks();
            loadUploaderSetup();
        } else { document.getElementById('login-screen').classList.add('visible'); }
    });
}

// Fetch the bearer token used by the desktop "Yada Yah Book PDF Generator"
// app and surface it next to the download button so admins can copy/paste
// once instead of provisioning via SQL. Only authenticated admins ever see
// this — the endpoint requireAuth()'s and the Admin → Books page itself is
// already gated.
function loadUploaderSetup() {
    fetch(API + '/admin-author-token.php', {credentials:'include'})
      .then(function(r){return safeJson(r);})
      .then(function(d) {
        if (!d || !d.token) return;
        var btn = document.getElementById('uploader-token-btn');
        btn.style.display = '';
        btn.addEventListener('click', function() {
            navigator.clipboard.writeText(d.token).then(function() {
                var orig = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(function() { btn.textContent = orig; }, 1000);
            });
        });
    }).catch(function() { /* non-fatal */ });
}
function doLogin() {
    var user = document.getElementById('login-user').value, pass = document.getElementById('login-pass').value;
    var errEl = document.getElementById('login-error'); errEl.style.display = 'none';
    fetch(API + '/auth.php', {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({login:user, password:pass})})
    .then(function(r){return safeJson(r);}).then(function(d) {
        if (d.authenticated) { document.getElementById('login-screen').classList.remove('visible'); document.getElementById('app').style.display = ''; document.getElementById('user-display').textContent = d.user_name; applyPagePermissions(d.pages); loadBooks(); }
        else { errEl.textContent = d.error || 'Login failed'; errEl.style.display = ''; }
    });
}
function doLogout() { fetch(API + '/auth.php', {method:'DELETE', credentials:'include'}).then(function() { location.reload(); }); }
function togglePassword() { var i = document.getElementById('login-pass'); i.type = i.type === 'password' ? 'text' : 'password'; }

var _pipelineRefreshTimer = null;
// Last-known nonzero paragraph + translation counts per volume_key,
// remembered across polls. The parser path (parse_volume_from_bundle.py)
// DELETEs all rows for the volume from yy_paragraph and yy_translation
// before re-INSERTing them — for ~30-90 seconds during a parse the live
// counts the server reports drop to 0. Without this guard the cells
// flicker "X T / Y P" → "0 T / 0 P" → back, which reads as "the parsed
// data disappeared." We hold the last good value during in-flight parses
// and only trust a smaller-or-zero count once the parse is settled.
var _lastVolumeCounts = {};

function loadBooks() {
    return fetch(API + '/admin-books.php', {credentials:'include'}).then(function(r){return safeJson(r);}).then(function(d) {
        allSeries = d.series || [];
        allVolumes = d.volumes || [];
        // Surgical count preservation: while a volume is parsing, never let
        // the displayed count drop. Track the running max; restore it onto
        // the volume object before render so dataCell() sees the held value.
        for (var __vi = 0; __vi < allVolumes.length; __vi++) {
            var __v = allVolumes[__vi];
            var __k = __v.volume_key;
            var __newPc = parseInt(__v.paragraph_count_live   || 0, 10);
            var __newTc = parseInt(__v.translation_count_live || 0, 10);
            var __status = (__v.volume_parse_status || '').toLowerCase();
            var __inProc = PROC_STATES.indexOf(__status) >= 0;
            var __prev = _lastVolumeCounts[__k] || { pc: 0, tc: 0 };
            if (__inProc) {
                if (__newPc > __prev.pc) __prev.pc = __newPc;
                if (__newTc > __prev.tc) __prev.tc = __newTc;
                _lastVolumeCounts[__k] = __prev;
                __v.paragraph_count_live   = __prev.pc;
                __v.translation_count_live = __prev.tc;
            } else {
                // Parse settled — trust the server's final number, even if
                // smaller (some paragraphs may have been filtered out).
                _lastVolumeCounts[__k] = { pc: __newPc, tc: __newTc };
            }
        }
        document.getElementById('book-count').textContent = allSeries.length + ' series, ' + allVolumes.length + ' volumes';
        renderBooks();
        // Auto-refresh every 6 seconds while any volume's pipeline is queued
        // or running, so the admin watches PDF/FLIP statuses flip live as the
        // host worker picks up jobs. Stops itself once everything is settled.
        var inFlight = allVolumes.some(function(v) {
            var s = (v.volume_pipeline_status || '').toLowerCase();
            var p = (v.volume_parse_status    || '').toLowerCase();
            return PROC_STATES.indexOf(s) >= 0 || PROC_STATES.indexOf(p) >= 0;
        });
        if (_pipelineRefreshTimer) { clearTimeout(_pipelineRefreshTimer); _pipelineRefreshTimer = null; }
        if (inFlight) {
            _pipelineRefreshTimer = setTimeout(loadBooks, 6000);
        }
    });
}

// Per-artifact status cell. Combines four facts:
//   - Does the artifact exist? (truthy `field`)
//   - Is the pipeline currently working on this volume? (procStates)
//   - When was it last generated? (`mtime` ISO string)
//   - Is it stale relative to its source? (mtime < sourceMtime)
//
// Result is a stacked icon + small age line. Tooltip shows full timestamp.
var PROC_STATES = ['queued', 'processing', 'running', 'pending'];
// Stacked local-time stamp: YYMMDD on one line, HH:MM on the next.
// Returns RAW HTML (with <br>) — callers must NOT pass through esc(). Output
// is purely numeric so no escaping concerns.
function ago(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getFullYear() % 100) + p(d.getMonth() + 1) + p(d.getDate())
         + '<br>' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fullDt(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString(); } catch(e) { return iso; }
}
// Data cell: paragraph + translation counts pulled live from yy_paragraph
// and yy_translation, plus a parse-status indicator that mirrors the docx→
// pdf→flip pattern. "Stale" means the docx is newer than the last parse,
// i.e. the in-database paragraphs/translations are out of sync with the
// current source. Tooltip shows the last-parse timestamp + status message.
function dataCell(v) {
    // When the volume has been explicitly opted out of parsing
    // (volume_parse_flag = false), the in-DB paragraph/translation
    // counts will always be zero and the "stale" / "error" states are
    // meaningless. Render just a plain empty circle with an explanatory
    // tooltip and skip the T/P count + stale-vs-source logic entirely.
    var parseFlagOff = (v.volume_parse_flag === false || v.volume_parse_flag === 'f');
    if (parseFlagOff) {
        return '<div class="status-cell" title="Parse disabled — this book is excluded from translation/glossary/paragraph extraction">'
             + '<span class="status-icon status-miss">○</span></div>';
    }
    var pc = v.paragraph_count_live || 0;
    var tc = v.translation_count_live || 0;
    var parseStatus = (v.volume_parse_status || '').toLowerCase();
    var inProc = PROC_STATES.indexOf(parseStatus) >= 0;
    var parseDt = v.volume_parse_dtime || null;
    var docxDt = v.volume_docx_mtime || null;
    var stale = false;
    if (parseDt && docxDt) {
        var pT = new Date(parseDt).getTime(), dT = new Date(docxDt).getTime();
        if (pT && dT && pT < dT - 1000) stale = true;
    }
    if (!parseDt && docxDt) stale = true; // never parsed but docx exists

    var icon, cls, sub, tipPrefix;
    if (inProc) {
        icon = stale ? '⟳' : '⏳';
        cls = 'status-proc';
        sub = stale ? 'reparsing' : 'parsing';
        tipPrefix = 'Paragraph + translation extraction in flight (' + esc(parseStatus) + ')';
    } else if (parseStatus === 'error') {
        icon = '✗'; cls = 'status-stale'; sub = 'error';
        tipPrefix = 'Last parse errored: ' + esc(v.volume_parse_message || '');
    } else if (stale) {
        icon = '↻'; cls = 'status-stale'; sub = 'stale';
        tipPrefix = 'DOCX is newer than the last parse — paragraphs/translations are out of date.';
    } else if (pc > 0 || tc > 0) {
        icon = '✓'; cls = 'status-gen'; sub = '';
        tipPrefix = 'Last parsed' + (parseDt ? ' on ' + fullDt(parseDt) : '');
    } else {
        icon = '○'; cls = 'status-miss'; sub = '';
        tipPrefix = 'No paragraphs or translations extracted yet';
    }
    // Stack the cell vertically — icon on top, T/P count below, then the
    // YYMMDD / HH:MM stack — to match the visual pattern of DOCX/PDF/FLIP.
    var countLine = '<div class="age" style="font-family:monospace;">'
                  + tc.toLocaleString() + 'T / ' + pc.toLocaleString() + 'P</div>';
    var ageLine = parseDt ? '<div class="age" title="' + esc(fullDt(parseDt)) + '">' + ago(parseDt) + '</div>' : (sub ? '<div class="age">' + esc(sub) + '</div>' : '');
    var pulse = inProc ? ' proc-pulse' : '';
    return '<div class="status-cell' + pulse + '" title="' + esc(tipPrefix) + '">'
         + '<span class="status-icon ' + cls + '">' + icon + '</span>'
         + ageLine
         + countLine
         + '</div>';
}

// Flipbook cell. Distinguishes the four states that artifactCell
// collapsed into a single "—":
// Flipbook column — uses the new self-hosted system at /<volume_code>/.
// admin-books.php sets volume_flip_mtime to the mtime of that dir's
// index.html when present. Three states:
//   - mtime present → ✓ + age (or ↻ if stale vs. the source PDF)
//   - PDF present, no flipbook → ⌛ "pending" (rebuild it via Edit form's Regenerate button)
//   - No PDF → ○ (no source to build from)
// Return the more-recent of two ISO mtimes (nulls ignored). Used to roll
// a multi-step pipeline's ancestor mtimes into one "effective source" so a
// downstream artifact is flagged stale when ANY ancestor is newer.
function laterMtime(a, b) {
    var ta = a ? new Date(a).getTime() : 0;
    var tb = b ? new Date(b).getTime() : 0;
    if (!ta && !tb) return null;
    return (ta >= tb) ? (a || b) : (b || a);
}

function flipCell(v) {
    var ps = (v.volume_pipeline_status || '').toLowerCase();
    if (v.volume_flip_mtime) {
        // The flipbook is built from the PDF, which is built from the DOCX.
        // Comparing only to the PDF misses the common case where the DOCX
        // was just re-uploaded but the PDF hasn't regenerated yet — the
        // flipbook would read as fresh against the still-old PDF. Compare
        // against the most-recent ancestor (PDF or DOCX) so a DOCX update
        // immediately marks the flipbook stale.
        var effSource = laterMtime(v.volume_pdf_mtime, v.volume_docx_mtime);
        return artifactCell(true, v.volume_flip_mtime, effSource, ps, 'Flipbook');
    }
    if (!v.volume_pdf) {
        return '<div class="status-cell"><span class="status-icon status-miss" title="No PDF — upload a DOCX first">○</span></div>';
    }
    return '<div class="status-cell">'
         + '<span class="status-icon" style="color:#a36100;" title="PDF ready — flipbook not built yet (use Edit → Regenerate)">⌛</span>'
         + '<div class="age" style="color:#a36100;">pending</div></div>';
}

// downloadHref: optional URL — when provided AND the artifact exists,
// the ✓/↻ icon is wrapped in a click-to-download <a>. Stops propagation
// so the row's edit-volume click handler doesn't fire.
function artifactCell(field, mtime, sourceMtime, pipelineStatus, label, downloadHref) {
    var ps = (pipelineStatus || '').toLowerCase();
    var inProc = PROC_STATES.indexOf(ps) >= 0;
    // Treat the artifact as "actually present" only if both the DB column
    // and a real mtime exist. Stale DB filename without a file on disk
    // (mtime null) reads as not-yet-generated.
    var present = !!field && !!mtime;
    // Pipeline is in flight AND we don't have the artifact yet — definitively
    // "being generated right now". Pulse animation reinforces that something
    // is actively happening.
    if (inProc && !present) {
        return '<div class="status-cell proc-pulse">'
             + '<span class="status-icon status-proc" title="' + label + ' is being generated (pipeline ' + esc(ps) + ')">⏳</span>'
             + '<div class="age">generate</div></div>';
    }
    if (!present) {
        return '<div class="status-cell"><span class="status-icon status-miss" title="' + label + ' not generated yet">○</span></div>';
    }
    // Field exists — show age + stale indicator if applicable.
    // Stale means: this artifact's mtime predates its source's mtime, i.e. the
    // source was updated more recently and this hasn't been regenerated yet.
    // If the pipeline is currently in flight, this gets re-decided on next refresh.
    var stale = false;
    if (mtime && sourceMtime) {
        var t = new Date(mtime).getTime(), st = new Date(sourceMtime).getTime();
        if (t && st && t < st - 1000) stale = true; // 1-sec slop
    }
    if (stale && inProc) {
        return '<div class="status-cell proc-pulse">'
             + '<span class="status-icon status-proc" title="' + label + ' is being regenerated (newer source detected)">⟳</span>'
             + '<div class="age">regenerating</div></div>';
    }
    function wrapIcon(iconHtml, title) {
        if (!downloadHref) return iconHtml;
        return '<a href="' + esc(downloadHref) + '" download '
             + 'onclick="event.stopPropagation()" '
             + 'title="' + esc(title) + ' — click to download" '
             + 'style="text-decoration:none;color:inherit;">' + iconHtml + '</a>';
    }
    if (stale) {
        var staleTitle = label + ' is older than its source — needs regeneration. Last built: ' + fullDt(mtime);
        return '<div class="status-cell">'
             + wrapIcon('<span class="status-icon status-stale" title="' + esc(staleTitle) + '">↻</span>', staleTitle)
             + '<div class="age">stale<br>' + ago(mtime) + '</div></div>';
    }
    var ageTxt = mtime ? ago(mtime) : '';
    var fullTxt = mtime ? fullDt(mtime) : '';
    var freshTitle = label + ' generated' + (fullTxt ? ' on ' + fullTxt : '');
    return '<div class="status-cell">'
         + wrapIcon('<span class="status-icon status-gen" title="' + esc(freshTitle) + '">✓</span>', freshTitle)
         + (ageTxt ? '<div class="age" title="' + esc(fullTxt) + '">' + ageTxt + '</div>' : '')
         + '</div>';
}

function renderBooks() {
    var container = document.getElementById('table-container');
    if (!allSeries.length) { container.innerHTML = '<div style="text-align:center;padding:30px;color:#888">No series found.</div>'; return; }

    // Banner: volumes that have a PDF but no flipbook built yet at /<volume_code>/.
    // "Build all" queues a flipbook regen for each pending volume.
    var pendingFlip = allVolumes.filter(function(v) {
        return v.volume_pdf && !v.volume_flip_mtime && v.volume_code;
    });
    var banner = '';
    if (pendingFlip.length > 0) {
        var pendingKeys = pendingFlip.map(function(v){ return v.volume_key; });
        var tipLines = pendingFlip.map(function(v){ return '⌛ ' + v.volume_label; });
        banner = '<div style="margin:0 0 10px;padding:10px 14px;background:#fff8e1;border:1px solid #f5d76e;border-radius:6px;font-size:0.85rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;" '
               + 'title="' + esc(tipLines.join(' | ')) + '">'
               + '<span><strong>' + pendingFlip.length + ' flipbook' + (pendingFlip.length === 1 ? '' : 's') + ' pending:</strong> '
               + '<span style="color:#a36100;">⌛ awaiting build</span></span>'
               + '<button id="reprocess-all-btn" onclick="buildAllPendingFlipbooks([' + pendingKeys.join(',') + '])" '
               + 'title="Queue a flipbook regen for every volume listed above" '
               + 'style="margin-left:auto;padding:5px 12px;background:#31345A;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;font-size:0.8rem;">'
               + 'Build all</button>'
               + '</div>';
        }

    // ONE table for all series; series rows span the whole width and act as
    // visual section dividers. Fixed column widths are honored across every
    // group so DOCX/PDF/FLIP/Status icons line up vertically down the page.
    var html = banner
        + '<table class="books-table">'
        + '<colgroup>'
        + '<col style="width:42px;">'         // #
        + '<col>'                              // Label (flex)
        + '<col style="width:240px;">'        // Code (book code)
        + '<col style="width:54px;">'         // Pages
        + '<col style="width:74px;">'         // DOCX
        + '<col style="width:74px;">'         // PDF
        + '<col style="width:77px;">'         // FLIP
        + '<col style="width:110px;">'        // Data (paragraphs + translations)
        + '<col style="width:74px;">'         // Active
        + '<col style="width:120px;">'        // Actions
        + '</colgroup>'
        + '<thead><tr>'
        + '<th>#</th>'
        + '<th>Label</th>'
        + '<th>Code</th>'
        + '<th>Pages</th>'
        + '<th class="status-cell" style="text-align:center;" title="Source .docx file uploaded">DOCX</th>'
        + '<th class="status-cell" style="text-align:center;" title="PDF generated from the .docx">PDF</th>'
        + '<th class="status-cell" style="text-align:center;" title="Self-hosted flipbook built at /&lt;volume_code&gt;/">FLIP</th>'
        + '<th class="status-cell" style="text-align:center;" title="Number of Translations (T) and Paragraphs (P) pulled from the document">YY Parse</th>'
        + '<th>Active</th>'
        + '<th>Actions</th>'
        + '</tr></thead><tbody>';

    for (var si = 0; si < allSeries.length; si++) {
        var s = allSeries[si];
        var vols = allVolumes.filter(function(v) { return v.series_key == s.series_key; });

        html += '<tr class="series-row" onclick="editSeries(' + s.series_key + ')">'
            + '<td colspan="10">'
            + '<div style="display:flex;justify-content:space-between;align-items:center;">'
            + '<span>' + esc(s.series_label) + ' <span class="series-meta">(' + vols.length + ' volume' + (vols.length !== 1 ? 's' : '') + ')</span></span>'
            + '<span class="series-actions" onclick="event.stopPropagation()">'
            + '<button onclick="addVolumeToSeries(' + s.series_key + ')">+ Volume</button>'
            + '<button onclick="editSeries(' + s.series_key + ')">Edit</button>'
            + '</span>'
            + '</div>'
            + '</td>'
            + '</tr>';

        for (var vi = 0; vi < vols.length; vi++) {
            var v = vols[vi];
            var ps = v.volume_pipeline_status;
            // Source-mtime chain: PDF's source is the DOCX; FLIP's source is
            // the PDF (and transitively the DOCX). DOCX has no upstream.
            html += '<tr class="volume-row" data-vol-key="' + v.volume_key + '" onclick="editVolume(' + v.volume_key + ')">'
                + '<td>' + (v.volume_number || '') + '</td>'
                + '<td><strong>' + esc(v.volume_label) + '</strong></td>'
                + '<td style="font-size:0.78rem;color:#666;font-family:monospace;">' + esc(v.volume_code || '') + '</td>'
                + '<td>' + (v.volume_page_count || '') + '</td>'
                + '<td>' + artifactCell(!!v.volume_docx,      v.volume_docx_mtime, null,                  ps, 'DOCX',      v.volume_docx ? '/u/books-word/' + encodeURIComponent(v.volume_docx) : null) + '</td>'
                + '<td>' + artifactCell(!!v.volume_pdf,       v.volume_pdf_mtime,  v.volume_docx_mtime,   ps, 'PDF',       v.volume_pdf  ? '/pdf/' + encodeURIComponent(v.volume_pdf)         : null) + '</td>'
                + '<td>' + flipCell(v) + '</td>'
                + '<td>' + dataCell(v) + '</td>'
                + '<td>' + (v.volume_active_flag ? '<span class="badge-active">Active</span>' : '<span class="badge-inactive">Inactive</span>') + '</td>'
                + '<td class="actions" onclick="event.stopPropagation()">'
                + '<button onclick="editVolume(' + v.volume_key + ')">Edit</button>'
                + '<button class="del" onclick="deleteVolume(' + v.volume_key + ',\'' + esc(v.volume_label).replace(/'/g,"\\'") + '\')">Del</button>'
                + '</td></tr>';
        }
    }
    html += '</tbody></table>';
    container.innerHTML = html;
}

function closeForm() { document.getElementById('form-overlay').classList.remove('open'); }

function saveVolume() {
    var key = document.getElementById('f-key').value;
    var label = document.getElementById('f-label').value.trim();
    if (!label) { alert('Label is required'); return; }

    // Canonicalize the book code on the client side: replace %20 / spaces
    // with hyphens, collapse doubled hyphens, trim leading/trailing hyphens.
    // The server does the same but doing it here keeps the user's input box
    // in sync with what actually gets stored.
    var rawCode = document.getElementById('f-code').value.trim();
    var code = rawCode
        .replace(/%20/g, '-')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '');
    if (code !== rawCode) document.getElementById('f-code').value = code;

    var payload = {
        series_key: parseInt(document.getElementById('f-series').value),
        volume_label: label,
        volume_number: parseInt(document.getElementById('f-number').value) || 0,
        volume_sort: parseInt(document.getElementById('f-sort').value) || 0,
        // volume_page_count is derived from the parser; never sent from the
        // form so an accidentally-edited value can't overwrite it.
        volume_code: code,
        volume_pdf: document.getElementById('f-pdf').value.trim(),
        volume_active_flag: document.getElementById('f-active').checked,
        volume_search_flag: document.getElementById('f-search-flag').checked,
        volume_parse_flag: document.getElementById('f-parse-flag').checked,
        volume_ask_yada_flag: document.getElementById('f-ask-yada-flag').checked,
        volume_ask_rating: Math.max(0, Math.min(100, parseInt(document.getElementById('f-ask-rating').value, 10) || 0)),
    };

    fetch(API + '/admin-books.php' + (key ? '?key=' + key : ''), {
        method: key ? 'PUT' : 'POST', credentials: 'include',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    }).then(function(r){return safeJson(r);}).then(function(d) {
        if (d.error) { alert(d.error); return; }
        // If volume_code changed and files were renamed, the server returns
        // a list of {from, to} pairs. Offer to register 301 redirects so any
        // existing links to the old DOCX/PDF URLs keep working.
        var pending = (d.renames && d.renames.length) ? d.renames : [];
        var afterRedirects = function() { closeForm(); loadBooks(); };
        if (!pending.length) { afterRedirects(); return; }
        var msg = 'Files were renamed:\n\n'
                + pending.map(function(p){ return '  ' + p.from + '  →  ' + p.to; }).join('\n')
                + '\n\nAdd 301 redirects from the old URLs to the new ones?';
        yesNoConfirm(msg, function(yes) {
            if (!yes) { afterRedirects(); return; }
            fetch(API + '/admin-books.php?action=add_redirects', {
                method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({action:'add_redirects', pairs: pending})
            }).then(function(r){return safeJson(r);}).then(function(rd) {
                if (rd && rd.error) alert('Save succeeded, but failed to register redirects: ' + rd.error);
                afterRedirects();
            }).catch(function(err) {
                alert('Save succeeded, but failed to register redirects: ' + err.message);
                afterRedirects();
            });
        });
    });
}

// Custom confirm modal — browser confirm() can't relabel its buttons, so
// when we want "Yes" / "No" instead of "OK" / "Cancel" we render our own
// overlay. Pre-formatted message preserves newlines so file-pair lists stay
// readable. cb(true|false) is invoked when the user clicks one of the buttons.
function yesNoConfirm(message, cb) {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);'
                     + 'z-index:2000;display:flex;justify-content:center;align-items:center;padding:20px;';
    var card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:10px;max-width:600px;width:100%;'
                       + 'box-shadow:0 8px 32px rgba(0,0,0,0.25);overflow:hidden;';
    card.innerHTML = '<div style="padding:18px 22px;font-size:0.9rem;white-space:pre-wrap;line-height:1.45;">'
                   + esc(message) + '</div>'
                   + '<div style="display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;background:#f6f6f6;border-top:1px solid #e0e0e0;">'
                   + '<button class="yn-no"  style="padding:6px 18px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer;font-weight:600;">No</button>'
                   + '<button class="yn-yes" style="padding:6px 18px;border-radius:4px;border:none;background:#31345A;color:#fff;cursor:pointer;font-weight:600;">Yes</button>'
                   + '</div>';
    ov.appendChild(card);
    document.body.appendChild(ov);
    var done = function(v) { document.body.removeChild(ov); cb(v); };
    card.querySelector('.yn-yes').onclick = function() { done(true);  };
    card.querySelector('.yn-no').onclick  = function() { done(false); };
    ov.onclick = function(e) { if (e.target === ov) done(false); };
    setTimeout(function(){ card.querySelector('.yn-yes').focus(); }, 0);
}

function deleteVolume(key, label) {
    if (!confirm('Delete volume "' + label + '"?')) return;
    fetch(API + '/admin-books.php?key=' + key, {method:'DELETE', credentials:'include'})
    .then(function(r){return safeJson(r);}).then(function(d) { if(d.error){alert(d.error);return;} loadBooks(); });
}

// Manually requeue the book pipeline. Used when auto-retry exhausted its 3
// attempts or the operator wants to kick a stuck job from the edit form.
function retryPipeline(volumeKey, btn) {
    if (!confirm('Requeue the book pipeline for this volume? It will run within ~1 minute on the host worker.')) return;
    var orig = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Queueing…'; }
    fetch(API + '/admin-books.php?action=retry_pipeline&key=' + volumeKey, {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action:'retry_pipeline', volume_key: volumeKey})
    }).then(function(r){return r.json();}).then(function(d) {
        if (d.error) {
            alert('Retry failed: ' + d.error);
            if (btn) { btn.disabled = false; btn.textContent = orig; }
            return;
        }
        if (btn) { btn.textContent = '✓ Queued'; btn.style.background = '#d4edda'; btn.style.borderColor = '#a3d4ad'; btn.style.color = '#155724'; }
        if (typeof loadBooks === 'function') loadBooks();
    }).catch(function(err) {
        alert('Retry failed: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = orig; }
    });
}

// Force-delete the existing PDF and re-render from the current DOCX.
// Different from Retry Pipeline: that one keeps a stale PDF (worker
// skips LibreOffice when the PDF exists). This deletes first so the
// rebuild is unconditional. Ideal when the docx was edited but not
// re-uploaded, or when you want to test a new render path.
// Form-context wrappers — small bridges between the new Edit-form buttons and
// the existing volume-key-based regen helpers.
function regeneratePdfFromForm(btn) {
    var volumeKey = parseInt(btn.dataset.volumeKey, 10);
    if (!volumeKey) return;
    regeneratePdf(volumeKey, btn);
}
function regenerateFlipbookFromForm(btn) {
    var volumeKey  = parseInt(btn.dataset.volumeKey, 10);
    var volumeCode = btn.dataset.volumeCode || '';
    if (!volumeKey || !volumeCode) {
        alert('Set a Book Code and ensure a PDF exists before regenerating the flipbook.');
        return;
    }
    if (!confirm('Rebuild the flipbook at /' + volumeCode + '/ from the current PDF?\n\nThe existing flipbook is moved to the archive; the new one replaces it once rendering finishes (~5 min on the host worker).')) return;
    var orig = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳ Queueing…';
    var statusEl = document.getElementById('f-flip-status');
    statusEl.textContent = '';
    fetch(API + '/admin-books.php?action=regenerate_flipbook&key=' + volumeKey, {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action:'regenerate_flipbook', volume_key: volumeKey})
    }).then(function(r){return r.json();}).then(function(d){
        if (d.error) {
            statusEl.style.color = '#c0392b';
            statusEl.textContent = 'Failed: ' + d.error;
            btn.disabled = false; btn.textContent = orig;
            return;
        }
        statusEl.style.color = '#27ae60';
        statusEl.textContent = '✓ Queued — flipbook will rebuild on next worker tick.';
        btn.textContent = '✓ Queued';
        btn.style.background = '#d4edda';
        btn.style.borderColor = '#a3d4ad';
        btn.style.color = '#155724';
        if (typeof loadBooks === 'function') loadBooks();
    }).catch(function(err){
        statusEl.style.color = '#c0392b';
        statusEl.textContent = 'Failed: ' + err.message;
        btn.disabled = false; btn.textContent = orig;
    });
}

// Queue a flipbook regen for every volume in the list. Sequential calls so
// the host worker isn't slammed; each enqueue is a tiny DB write so the
// total rapid-fire stays well under any rate limit.
function buildAllPendingFlipbooks(volumeKeys) {
    if (!volumeKeys || !volumeKeys.length) return;
    var n = volumeKeys.length;
    if (!confirm('Queue ' + n + ' flipbook' + (n === 1 ? '' : 's') + ' for rebuild? They run sequentially on the host worker (~5 min each).')) return;
    var btn = document.getElementById('reprocess-all-btn');
    var done = 0;
    var step = function(i) {
        if (i >= volumeKeys.length) {
            if (btn) { btn.textContent = '✓ Queued ' + done + '/' + n; btn.disabled = true; }
            if (typeof loadBooks === 'function') loadBooks();
            return;
        }
        if (btn) { btn.textContent = '⏳ Queueing ' + (i + 1) + '/' + n + '…'; btn.disabled = true; }
        fetch(API + '/admin-books.php?action=regenerate_flipbook&key=' + volumeKeys[i], {
            method:'POST', credentials:'include',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({action:'regenerate_flipbook', volume_key: volumeKeys[i]})
        }).then(function(r){return r.json();}).then(function(d){
            if (!d.error) done++;
            step(i + 1);
        }).catch(function(){ step(i + 1); });
    };
    step(0);
}

function regeneratePdf(volumeKey, btn) {
    if (!confirm('Delete the existing PDF and regenerate it from the current DOCX?\n\nThe flipbook will need a separate regenerate to pick up the new PDF.')) return;
    var orig = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Queueing…'; }
    fetch(API + '/admin-books.php?action=regenerate_pdf&key=' + volumeKey, {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action:'regenerate_pdf', volume_key: volumeKey})
    }).then(function(r){return r.json();}).then(function(d) {
        if (d.error) {
            alert('Regenerate failed: ' + d.error);
            if (btn) { btn.disabled = false; btn.textContent = orig; }
            return;
        }
        if (btn) { btn.textContent = d.deleted_pdf ? '✓ PDF deleted, queued' : '✓ Queued'; btn.style.background = '#d4edda'; btn.style.borderColor = '#a3d4ad'; btn.style.color = '#155724'; }
        if (typeof loadBooks === 'function') loadBooks();
    }).catch(function(err) {
        alert('Regenerate failed: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = orig; }
    });
}

// Bulk reprocess every volume whose pipeline status is 'error'. Calls
// retry_pipeline serially with a short pause between each — the host worker
// processes one book at a time, and bursting requests would just queue up
// identical job files. Confirms once up front, surfaces overall progress in
// the button text, and reloads the books list when done.
function reprocessFailed(volumeKeys) {
    if (!volumeKeys || !volumeKeys.length) return;
    var n = volumeKeys.length;
    if (!confirm('Requeue ' + n + ' failed flipbook' + (n === 1 ? '' : 's') + '? Each runs through DOCX → PDF → flipbook build again on the host worker (one at a time, ~2-5 min each).')) return;
    var btn = document.getElementById('reprocess-all-btn');
    var orig = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.style.opacity = '0.7'; btn.style.cursor = 'wait'; }
    var done = 0, failed = 0;
    function step(i) {
        if (i >= volumeKeys.length) {
            if (btn) {
                btn.textContent = '✓ Queued ' + done + (failed ? ' (' + failed + ' failed)' : '');
                btn.style.background = failed ? '#fff3cd' : '#d4edda';
                btn.style.color = failed ? '#856404' : '#155724';
            }
            if (typeof loadBooks === 'function') setTimeout(loadBooks, 1500);
            return;
        }
        if (btn) btn.textContent = '⏳ Queueing ' + (i + 1) + '/' + n + '…';
        fetch(API + '/admin-books.php?action=retry_pipeline&key=' + volumeKeys[i], {
            method: 'POST', credentials: 'include',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({action:'retry_pipeline', volume_key: volumeKeys[i]})
        }).then(function(r){ return r.json(); }).then(function(d) {
            if (d && !d.error) done++; else failed++;
            // 200ms pause keeps us off the rate limiter and gives PHP time to
            // write each job file before we drop the next.
            setTimeout(function(){ step(i + 1); }, 200);
        }).catch(function() {
            failed++;
            setTimeout(function(){ step(i + 1); }, 200);
        });
    }
    step(0);
}

function uploadDocx() {
    var key = document.getElementById('f-key').value;
    if (!key) { alert('Save the volume first before uploading a .docx'); return; }
    var fileInput = document.getElementById('f-docx-file');
    if (!fileInput || !fileInput.files[0]) { alert('Choose a .docx file first'); return; }
    var statusEl = document.getElementById('f-docx-status');
    statusEl.innerHTML = '<span style="color:#888">Uploading…</span>';

    var fd = new FormData();
    fd.append('docx', fileInput.files[0]);
    fetch(API + '/admin-books.php?action=upload_docx&key=' + key, {
        method: 'POST', credentials: 'include', body: fd
    }).then(function(r){return safeJson(r);}).then(function(d) {
        if (d.error) {
            statusEl.innerHTML = '<span style="color:#c0392b">' + esc(d.error) + '</span>';
            return;
        }
        statusEl.innerHTML = '<span style="color:#2980b9">Queued. Conversion + flipbook build runs on the host (typically 1–3 minutes).</span>';
        // Refresh books list so the new docx + status show up; reload the form too
        loadBooks().then(function() {
            var v = allVolumes.find(function(r){return r.volume_key==key;});
            if (v) showVolumeForm(v);
        });
    }).catch(function() {
        statusEl.innerHTML = '<span style="color:#c0392b">Upload failed (network)</span>';
    });
}

// ── Series Form ──
function editSeries(key) {
    var s = allSeries.find(function(r){return r.series_key==key;});
    if (!s) return;
    document.getElementById('series-form-title').textContent = 'Edit Series';
    document.getElementById('sf-key').value = s.series_key;
    document.getElementById('sf-label').value = s.series_label || '';
    document.getElementById('sf-name').value = s.series_name || '';
    document.getElementById('sf-number').value = s.series_number || 0;
    document.getElementById('sf-sort').value = s.series_sort || 0;
    document.getElementById('sf-summary').value = s.series_summary || '';
    document.getElementById('series-form-overlay').classList.add('open');
}

function closeSeriesForm() { document.getElementById('series-form-overlay').classList.remove('open'); }

function saveSeries() {
    var key = document.getElementById('sf-key').value;
    var payload = {
        series_label: document.getElementById('sf-label').value.trim(),
        series_name: document.getElementById('sf-name').value.trim(),
        series_number: parseInt(document.getElementById('sf-number').value) || 0,
        series_sort: parseInt(document.getElementById('sf-sort').value) || 0,
        series_summary: document.getElementById('sf-summary').value.trim(),
    };
    if (!payload.series_label) { alert('Label is required'); return; }

    fetch(API + '/admin-books.php?series_key=' + key, {
        method: 'PUT', credentials: 'include',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    }).then(function(r){return safeJson(r);}).then(function(d) { if(d.error){alert(d.error);return;} closeSeriesForm(); loadBooks(); });
}
